apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-app
  labels:
    app: admin-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-app
  template:
    metadata:
      labels:
        app: admin-app 
    spec:
      containers:
      - name: nginx
        image: govardhantanga/admin:v1
        ports:
        - containerPort: 80
