apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: food-backend-hpa
  namespace: {{ .Release.Namespace }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-backend

  minReplicas: 1
  maxReplicas: 4

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50