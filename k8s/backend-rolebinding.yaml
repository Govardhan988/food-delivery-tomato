apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: food-backend-rolebinding
  namespace: food-delivery

subjects:
  - kind: ServiceAccount
    name: food-backend-sa
    namespace: food-delivery

roleRef:
  kind: Role
  name: food-backend-role
  apiGroup: rbac.authorization.k8s.io